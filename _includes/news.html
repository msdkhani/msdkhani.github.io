<div class="updates">{% assign ordered_news = site.news | sort: 'date' | reverse %}{% for item in ordered_news %}<article class="update"><time datetime="{{ item.date | date: '%Y-%m-%d' }}">{{ item.date | date: '%b %-d, %Y' }}</time><div>{% if item.inline %}{{ item.content }}{% else %}<a href="{{ item.url | relative_url }}">{{ item.title }}</a>{% endif %}</div></article>{% endfor %}</div>
