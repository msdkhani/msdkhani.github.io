<div class="cv-timeline">{% for content in entry.contents %}<article class="cv-position"><p class="cv-date">{{ content.year }}</p><div><h3>{{ content.title }}</h3><p class="cv-institution">{{ content.institution }}</p>{% if content.description.size > 0 %}<ul>{% for item in content.description %}<li>{{ item }}</li>{% endfor %}</ul>{% endif %}</div></article>{% endfor %}</div>
